[pytest]
# 只收集 tests/ 下的单测。
#
# 背景（真实踩坑，勿删注释）：仓库根目录的 test_server.py / test_service.py 是
# M6-2 时期留下的「手工冒烟脚本」——它们不是单测，必须先起真实服务并直连
# http://localhost:8000（宿主未暴露该端口，容器内才可达），函数名虽以 test_ 开头，
# 但内部是 `await httpx...` 的裸 async 函数，没有 asyncio 插件配合 → 被 pytest 收集后
# 稳定报 "async def functions are not natively supported" 1 failed + 1 error。
# 这不是被测代码的缺陷，而是「冒烟脚本被误当单测收集」。
#
# 根治办法是限定 testpaths（而非删脚本、也非给它们打 skip 掩盖失败）：
# 冒烟脚本保留在根目录，由人显式 `python test_server.py` 在服务起来后手工跑。
testpaths = tests
python_files = test_*.py
