# config/plugins.yaml · 数据源插件注册表（M9-2，M10-P5 六分类 + 教程字段）
#
# 接管 config/tools.yaml 的 web_search.provider 单选。
# 热加载：build_tools 每次重读，改完下一个任务即生效（零重启，mirror model_mapping/agents_library）。
# 密钥不落本文件，走 .secrets/plugins.env（DS_<ID大写>_API_KEY）；tavily 兼容旧 TAVILY_API_KEY。
#
# 状态说明：
#   connected     = 引擎会真实取数（none-auth 源 / 已配 key 的 api_key 源）
#   disconnected  = api_key 源但尚未配置密钥 / 已实现但被控制器关闭
#   coming_soon   = 后端尚未接入可用 Provider（引擎永远跳过，绝不冒充可用）；UI 重解释为
#                   「待接入后端 / 后端未接入」并给出真实官网与「获取密钥」教程链接（M10-P5）
# status 由引擎 load_data_sources 按密钥实况重算，此处初值仅作展示默认。
#
# M10-P5 新增元数据字段（前端插件市场使用，不进引擎逻辑）：
#   doc_url       官方站点/文档（真实根域）
#   key_guide_url 去哪申请/获取 API Key 的控制台或教程页（仅 api_key/oauth 插件，真实根域）
#   key_env       密钥对应 env 名提示（如 DS_QCC_API_KEY）
#
# 分类（M10-P5 收敛为 6）：综合检索 / 学术文献 / 百科知识 / 财经行情 / 企业工商 / 电商数据

plugins:
# ---- M11：实时天气 / 通用网页（keyless 公开 API，无需密钥；失败即单源降级）----
# 顺序即优先级：search_many 按本列表顺序聚合结果，而 _run_fc_loop 把结果整段回注模型且**无条数上限**，
# 排末尾的源会被几十条学术/网页结果淹没（模型读不到，footer 取前 8 条也轮不上）。
# 故 open_meteo/duckduckgo 置顶，确保天气与通用网页结果排在最前（模型必看、footer 必现）。
- id: open_meteo
  name: Open-Meteo 天气
  icon: ""
  category: 综合检索
  description: 实时天气查询（气温/体感/湿度/风速/降水/天气现象，Open-Meteo 公开 API 无需密钥）
  auth_type: none
  provider: open_meteo        # M11：真源（tools.data_sources.OpenMeteoProvider，geocoding+forecast）
  enabled: true
  status: connected           # 运行时重算：auth=none → connected
  builtin: true
  doc_url: https://open-meteo.com/

- id: duckduckgo
  name: DuckDuckGo 网页
  icon: ""
  category: 综合检索
  description: 通用网页检索（DuckDuckGo lite，无需密钥；容器网络出口可达时生效，不可达则单源降级）
  auth_type: none
  provider: duckduckgo        # M11：真源（tools.data_sources.DuckDuckGoProvider）
  enabled: true
  status: connected           # 运行时重算：auth=none → connected
  builtin: true
  doc_url: https://duckduckgo.com/

- id: rss_news
  name: 官方媒体 RSS 新闻
  icon: ""
  category: 新闻资讯
  description: 国内外实时新闻（新华网/人民网/中新网/IT之家 官方 RSS，无需密钥；仅新闻类查询返回，非新闻查询不污染其它检索）
  auth_type: none
  provider: rss_news          # 真源（tools.data_sources.RssNewsProvider，多 feed 聚合 + 单 feed 降级）
  enabled: true
  status: connected           # 运行时重算：auth=none → connected
  builtin: true
  doc_url: http://www.people.com.cn/

- id: tavily
  name: Tavily 搜索
  icon: ""
  category: 综合检索
  description: 实时网络检索，支持学术/新闻/财经源
  auth_type: api_key
  provider: tavily
  enabled: true              # 控制器开关：false → 引擎不取 Tavily
  status: disconnected       # 运行时重算：有 DS_TAVILY_API_KEY 才 connected
  builtin: true
  doc_url: https://tavily.com/
